<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1c2430">
    <title>Offline · Personal PM</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1ea;
            color: #1c2430;
            font-family: Georgia, "Times New Roman", serif;
            padding: 1.5rem;
        }
        main {
            width: min(28rem, 100%);
            background: #fffdf8;
            border: 1px solid #e6dfd2;
            border-radius: 0.9rem;
            padding: 1.5rem;
        }
        h1 { font-size: 1.4rem; margin: 0 0 0.6rem; }
        p { margin: 0 0 1rem; color: #667085; }
        a {
            display: inline-block;
            background: #1c2430;
            color: #fff;
            text-decoration: none;
            border-radius: 0.45rem;
            padding: 0.65rem 1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Personal PM needs a connection to load tasks and the calendar. Reconnect and try again.</p>
        <a href="/dashboard">Retry</a>
    </main>
</body>
</html>
